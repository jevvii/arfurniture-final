<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beauteous Palochina - Philippine Handcrafted Wooden Furniture</title>
    <link rel="icon" type="image/png" href="/logo/logo.png" />
    <link rel="apple-touch-icon" href="/logo/logo.png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Model Viewer for WebXR/AR -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
    <style>
      /* Custom scrollbar for warm wood aesthetic */
      ::-webkit-scrollbar {
        width: 10px;
      }
      ::-webkit-scrollbar-track {
        background: #2b180d;
      }
      ::-webkit-scrollbar-thumb {
        background: #8b572a;
        border-radius: 5px;
        border: 2px solid #2b180d;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #af723e;
      }

      /* Philippine Woody Brown Background (Rich Timber & Solihiya Weave) */
      body {
        margin: 0;
        background-color: #3b2416;
        background-image: 
          radial-gradient(ellipse at 50% 0%, rgba(186, 128, 77, 0.25) 0%, rgba(41, 24, 14, 0.95) 85%),
          url('/philippine-solihiya-pattern.svg');
        background-repeat: repeat;
        background-attachment: fixed;
        color: #f7ede2;
      }

      .philippine-wood-bg {
        background-color: #3b2416;
        background-image: 
          radial-gradient(ellipse at 50% 0%, rgba(186, 128, 77, 0.25) 0%, rgba(41, 24, 14, 0.95) 85%),
          url('/philippine-solihiya-pattern.svg');
        background-repeat: repeat;
        background-attachment: fixed;
      }

      model-viewer {
        width: 100%;
        height: 100%;
        background-color: #2b180d;
      }
    </style>
  </head>
  <body class="philippine-wood-bg">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
